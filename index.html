<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" type="text/css" href="friendsList.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <title>Friends List</title>
  </head>
  <body>
    <section class="friendAppContainer">
      <h1>Friends List</h1>

      <div class="buttonContainer">
        <button type="button" class="addFriendModalButton" onclick="handleAddFriendsModal()">Add Friend</button>
        <button type="button" class="blocklistButton" onclick="handleRedirectBlocklist()">Blocklist</button>
      </div>

      <form class="searchForm">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input
          type="text"
          name="search"
          class="searchInput"
          placeholder="Search for any friend"
          onkeyup="handleSearchFriend()"
        />

        <button type="button" class="clearButton" onclick="handleClearInput()">
          <i class="fa-solid fa-x"></i>
        </button>

        <div class="menuModal">
          <button type="button" class="addFriend" onclick="handleAddFriendsModal()">Add Friend</button>
          <button type="button" class="blockedPlayers" onclick="handleBlockedPlayers()">Blocked Players</button>
        </div>
      </form>

      <div class="filtersContainer">
        <div class="filterButtonContainer">
          <button type="button" class="allFriends activeButton" onclick="handleAllFriends()">All ✓</button>

          <button type="button" class="onlineFriends" onclick="handleFilterOnline()">Online</button>
        </div>

        <div class="sortButtonContainer">
          <!-- <p>Sort by:</p> -->

          <button type="button" class="alphabetically" onclick="handleFilterAlpha()">Name</button>

          <button type="button" class="age" onclick="handleFilterAge()">Age</button>
        </div>
      </div>

      <button type="button" class="friendsListButton" onclick="handleShowFriends()">
        <div class="friendsIcon">
          <i class="fa-solid fa-angle-up"></i>
          <!-- <i class="fa-solid fa-angle-down"></i> -->
        </div>
        <p>Friends</p>
        <div class="friendsText"></div>
      </button>

      <div class="friendsListButtonContainer"></div>

      <div class="friendsContainer"></div>

      <div class="emptyText">There are no results for you request.</div>
    </section>

    <div class="friendlistEmptyContainer">
      <h3>No friends yet!</h3>
      <p>Use the below button to add friend to your list:</p>
      <button type="button" class="addFriend" onclick="handleAddFriendsModal()">Add Friend</button>
    </div>

    <div class="addFriendModal">
      <form class="addFriendForm">
        <p>Add a new friend to your list</p>
        <input
          type="text"
          placeholder="Type Friend name that you want to add..."
          name="friendName"
          class="friendName"
          maxlength="32"
          required
        />

        <span>Maximum length is 32 characters</span>

        <div class="addFriendButtonContainer">
          <button type="button" class="addFriendCancelButton" onclick="handleCloseAddFriendModal()">
            Cancel
          </button>
          <button type="submit" class="addFriendButton" onclick="handleAddFriend(event)">Add</button>
        </div>
      </form>
    </div>

    <div class="errorContainer"></div>

    <div id="loader" class="spinner"></div>

</html>
